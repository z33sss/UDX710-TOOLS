name: Build UDX710 Tools
on:
  push:
  workflow_dispatch:
jobs:
  build-arm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build web
        run: |
          cd web
          npm install && npm run build

      - name: build server (C, aarch64 cross compile inside docker)
        run: |
          docker run --rm -v $GITHUB_WORKSPACE:/work -w /work/src tonistiigi/xx:golang \
            sh -c "xx-apk add gcc aarch64-linux-gnu-gcc && \
            export CROSS_COMPILE=aarch64-linux-gnu- && \
            make && mkdir -p build && cp ofono-server build/"

      - name: dopack
        run: |
          mkdir -p output/6677
          echo "#!/bin/sh" > start.sh
          echo "cd /home/root/6677" >> start.sh
          echo "chmod 755 *" >> start.sh
          echo "./server &" >> start.sh
          mv start.sh output/6677/
          cp -r web/dist output/6677/
          cp src/build/ofono-server output/6677/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: udx710-tools
          path: output
